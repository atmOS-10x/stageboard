# Publishes @atmos.build/stageboard to npm when main carries a version that isn't on npm yet, then tags it and
# writes a GitHub release. To release: bump "version" in packages/stageboard/package.json and merge to main.
# npm trusts this workflow (Trusted Publisher on npmjs.com), so there is no npm token, and every version gets
# a provenance attestation.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atmos.build/stageboard typecheck
      - run: pnpm --filter @atmos.build/stageboard test

      - name: Is this version on npm yet?
        id: version
        run: |
          version=$(node -p "require('./packages/stageboard/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@atmos.build/stageboard@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@atmos.build/stageboard@$version is already on npm; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/stageboard
        run: npm publish --provenance --access public

      - name: GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
